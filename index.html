<title>FJC Operations Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell, left rail of modules on desktop, top tab strip on phones; content is tables and checkpoint cards */
:root {
  --bg: #f5f7f6; --surface: #ffffff; --line: #dde3e1; --fg: #17201e; --muted: #5d6b67;
  --accent: #0f6b5f; --accent-soft: #e3f1ee; --pork: #b0465a; --chicken: #b7791f;
  --good: #2e7d4f; --good-soft: #e5f3ea; --warn: #a8660b; --warn-soft: #fbf0dc; --bad: #b3261e; --bad-soft: #fbe6e4;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1413; --surface: #171e1c; --line: #2a3431; --fg: #e6ecea; --muted: #97a6a1;
  --accent: #4fb7a6; --accent-soft: #173a34; --pork: #e07b8e; --chicken: #e0a84f;
  --good: #6cc48f; --good-soft: #17301f; --warn: #e6a64a; --warn-soft: #3a2c12; --bad: #f07a70; --bad-soft: #3d1a17; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1413; --surface: #171e1c; --line: #2a3431; --fg: #e6ecea; --muted: #97a6a1;
  --accent: #4fb7a6; --accent-soft: #173a34; --pork: #e07b8e; --chicken: #e0a84f;
  --good: #6cc48f; --good-soft: #17301f; --warn: #e6a64a; --warn-soft: #3a2c12; --bad: #f07a70; --bad-soft: #3d1a17; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
.num, td.n, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; }
.brand { padding: 0 10px 16px; }
.brand b { display: block; font-size: 15px; }
.brand span { color: var(--muted); font-size: 12px; }
.rail a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; font-weight: 500; }
.rail a:hover { background: var(--bg); }
.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.rail a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rail .who { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
main { min-width: 0; padding-block: 20px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; max-width: 1180px; }
.banner { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 6px 10px; }
h1 { font-size: 22px; margin: 0; font-weight: 600; text-wrap: balance; }
h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
.sub { color: var(--muted); margin: 4px 0 0; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tile .v { font-family: var(--mono); font-size: 24px; margin-top: 4px; }
.tile .d { font-size: 12px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th.n, td.n { text-align: right; }
.pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
.p-draft { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.p-confirmed { background: var(--accent-soft); color: var(--accent); }
.p-processing { background: var(--warn-soft); color: var(--warn); }
.p-dispatched { background: var(--accent-soft); color: var(--accent); }
.p-delivered, .p-ok { background: var(--good-soft); color: var(--good); }
.p-warn { background: var(--warn-soft); color: var(--warn); }
.p-bad { background: var(--bad-soft); color: var(--bad); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.dot.pork { background: var(--pork); } .dot.chicken { background: var(--chicken); }
button, .btn { font: inherit; font-weight: 500; border-radius: 6px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.small { padding: 4px 10px; font-size: 13px; }
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
input, select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; }
.form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; }
.lines { display: flex; flex-direction: column; gap: 8px; grid-column: 1 / -1; }
.line { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.alerts li { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 6px; background: var(--bg); }
.alerts a { color: var(--accent); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.chain { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.cp { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; position: relative; }
.cp.bad { border-color: var(--bad); box-shadow: inset 0 3px 0 var(--bad); }
.cp.warn { border-color: var(--warn); box-shadow: inset 0 3px 0 var(--warn); }
.cp .step { font-size: 12px; color: var(--muted); }
.cp .t { font-weight: 600; }
.cp .q { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cp .pill { white-space: normal; }
.cp .meta { font-size: 12px; color: var(--muted); }
.slider { display: flex; align-items: center; gap: 10px; }
.slider input { width: 180px; }
.calc { font-size: 12px; color: var(--muted); }
.limit { font-weight: 600; color: var(--accent); }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 6px; font-size: 13px; }
.muted { color: var(--muted); }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .brand, .rail .who { display: none; }
  .rail a { white-space: nowrap; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2, .form { grid-template-columns: 1fr; }
  .chain { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .rail a, button { transition: background .15s, color .15s; } }
</style>

<div class="shell">
  <nav class="rail" aria-label="Modules">
    <div class="brand"><b>FJC Livestock Trading</b><span>Operations system · prototype</span></div>
    <a href="#dashboard" data-v="dashboard">Dashboard</a>
    <a href="#orders" data-v="orders">Orders</a>
    <a href="#forecast" data-v="forecast">Forecast</a>
    <a href="#inventory" data-v="inventory">Inventory</a>
    <a href="#audit" data-v="audit">Audit trail</a>
    <div class="who">Signed in as <b>Owner</b><br>Main office</div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const PRODUCTS = [
  { id: 'liempo', name: 'Liempo (belly)', kind: 'pork', unit: 'kg', perHead: 8.5, price: 340 },
  { id: 'kasim', name: 'Kasim (shoulder)', kind: 'pork', unit: 'kg', perHead: 9, price: 310 },
  { id: 'pigue', name: 'Pigue (leg)', kind: 'pork', unit: 'kg', perHead: 12, price: 300 },
  { id: 'pata', name: 'Pata (hock)', kind: 'pork', unit: 'kg', perHead: 4.5, price: 260 },
  { id: 'ulo', name: 'Ulo (head)', kind: 'pork', unit: 'kg', perHead: 6, price: 150 },
  { id: 'lamanloob', name: 'Laman loob', kind: 'pork', unit: 'kg', perHead: 5, price: 160 },
  { id: 'whole', name: 'Whole dressed chicken', kind: 'chicken', unit: 'pc', perHead: 1, price: 210 },
  { id: 'breast', name: 'Chicken breast', kind: 'chicken', unit: 'kg', perHead: 0.38, price: 230 },
  { id: 'wings', name: 'Chicken wings', kind: 'chicken', unit: 'kg', perHead: 0.13, price: 220 },
  { id: 'legs', name: 'Leg quarters', kind: 'chicken', unit: 'kg', perHead: 0.32, price: 190 },
];
const P = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
const LOCS = [
  { id: 'main', name: 'Main office' },
  { id: 's1', name: 'Store 1 · Bagsakan' },
  { id: 's2', name: 'Store 2 · Poblacion' },
  { id: 's3', name: 'Store 3 · Talipapa' },
];
const L = Object.fromEntries(LOCS.map(l => [l.id, l]));
const CLIENTS = ['Store 1 · Bagsakan', 'Store 2 · Poblacion', 'Store 3 · Talipapa', 'Kusina ni Rey (resto)', 'Aling Nena Carinderia', 'Lechon Haus (reseller)'];
const DELIVERY_DAY = 'Wed, Nov 25';

const state = {
  orders: [
    { id: 'SO-1041', client: 'Store 1 · Bagsakan', date: DELIVERY_DAY, status: 'confirmed', items: [['liempo', 45], ['kasim', 40], ['pigue', 50], ['whole', 60]] },
    { id: 'SO-1042', client: 'Store 2 · Poblacion', date: DELIVERY_DAY, status: 'confirmed', items: [['liempo', 38], ['pata', 20], ['ulo', 18], ['breast', 25], ['wings', 15]] },
    { id: 'SO-1043', client: 'Kusina ni Rey (resto)', date: DELIVERY_DAY, status: 'confirmed', items: [['liempo', 30], ['lamanloob', 25], ['legs', 30]] },
    { id: 'SO-1044', client: 'Lechon Haus (reseller)', date: DELIVERY_DAY, status: 'draft', items: [['pigue', 40], ['kasim', 25]] },
    { id: 'SO-1045', client: 'Store 3 · Talipapa', date: DELIVERY_DAY, status: 'confirmed', items: [['liempo', 28], ['pigue', 30], ['whole', 45], ['legs', 20]] },
    { id: 'SO-1038', client: 'Aling Nena Carinderia', date: 'Tue, Nov 24', status: 'dispatched', items: [['kasim', 20], ['whole', 30]] },
    { id: 'SO-1036', client: 'Store 2 · Poblacion', date: 'Mon, Nov 23', status: 'delivered', items: [['liempo', 40], ['pigue', 35]] },
  ],
  stock: {
    main: { liempo: 22, kasim: 31, pigue: 18, pata: 14, ulo: 9, lamanloob: 6, whole: 24, breast: 8, wings: 4, legs: 12 },
    s1: { liempo: 6, kasim: 9, pigue: 11, pata: 3, ulo: 2, lamanloob: 1, whole: 14, breast: 3, wings: 2, legs: 4 },
    s2: { liempo: 3, kasim: 5, pigue: 4, pata: 6, ulo: 5, lamanloob: 2, whole: 8, breast: 1.5, wings: 0.8, legs: 3 },
    s3: { liempo: 9, kasim: 4, pigue: 7, pata: 2, ulo: 1, lamanloob: 0, whole: 11, breast: 2, wings: 1, legs: 5 },
  },
  reorder: { liempo: 5, kasim: 5, pigue: 5, pata: 3, ulo: 2, lamanloob: 2, whole: 10, breast: 2, wings: 1, legs: 3 },
  transfers: [
    { id: 'TR-552', to: 's2', lot: 'LOT-1123-P03', sent: [['liempo', 60], ['kasim', 50], ['pigue', 70]], status: 'received', received: 172.5 },
    { id: 'TR-553', to: 's1', lot: 'LOT-1123-P03', sent: [['liempo', 40], ['pigue', 45], ['pata', 15]], status: 'in transit' },
    { id: 'TR-554', to: 's3', lot: 'LOT-1123-C07', sent: [['whole', 40], ['legs', 18]], status: 'in transit' },
  ],
  buffer: 10,
  invLoc: 'all',
  lot: 'LOT-1123-P03',
};

const LOTS = {
  'LOT-1123-P03': { kind: 'pork', label: '12 pigs · Dela Cruz Farm, Bulacan', cps: [
    { t: 'Pickup at farm', q: '12 head · 1,236 kg', who: 'Ramon (driver)', at: 'Nov 23, 06:10', note: 'Truck NBC-4821', flag: 'ok' },
    { t: 'Receiving', q: '12 head · 1,229 kg', who: 'Lito (receiving)', at: 'Nov 23, 08:05', note: '−7 kg (0.6%) · within 1% tolerance', flag: 'ok' },
    { t: 'Slaughter and cutting', q: '842 kg cuts', who: 'Boy (processing)', at: 'Nov 23, 11:40', note: 'Yield 68.5% vs 70% expected', flag: 'warn' },
    { t: 'Dispatch', q: '180 kg to Store 2', who: 'Ramon (driver)', at: 'Nov 23, 14:20', note: 'TR-552 · liempo, kasim, pigue', flag: 'ok' },
    { t: 'Delivery', q: '172.5 kg received', who: 'Joy (Store 2)', at: 'Nov 23, 15:05', note: '−7.5 kg (4.2%) · over 1% tolerance', flag: 'bad' },
  ]},
  'LOT-1123-C07': { kind: 'chicken', label: '400 birds · Santos Poultry, Pampanga', cps: [
    { t: 'Pickup at farm', q: '400 birds · 812 kg', who: 'Edwin (driver)', at: 'Nov 23, 04:30', note: 'Truck WQK-118', flag: 'ok' },
    { t: 'Receiving', q: '396 birds · 803 kg', who: 'Lito (receiving)', at: 'Nov 23, 06:15', note: '4 dead on arrival logged', flag: 'warn' },
    { t: 'Slaughter and cutting', q: '396 dressed · 571 kg', who: 'Boy (processing)', at: 'Nov 23, 09:50', note: 'Yield 71.1% vs 71% expected', flag: 'ok' },
    { t: 'Dispatch', q: '40 pcs + 18 kg to Store 3', who: 'Edwin (driver)', at: 'Nov 24, 05:40', note: 'TR-554', flag: 'ok' },
    { t: 'Delivery', q: 'Awaiting store', who: 'Store 3', at: '—', note: 'Not yet confirmed', flag: 'pending' },
  ]},
};
const LOG = [
  ['Nov 23, 15:06', 'Joy (Store 2)', 'Confirmed TR-552 received: 172.5 kg (sent 180 kg)'],
  ['Nov 23, 15:06', 'System', 'Variance alert raised on LOT-1123-P03 delivery: −7.5 kg'],
  ['Nov 23, 13:12', 'Office manager', 'Edited SO-1042: liempo 30 → 38 kg (reason: client called)'],
  ['Nov 23, 11:41', 'Boy (processing)', 'Logged cutting output for LOT-1123-P03: 842 kg'],
  ['Nov 23, 08:06', 'Lito (receiving)', 'Received LOT-1123-P03: 12 head, 1,229 kg'],
];

const $ = s => document.querySelector(s);
const fmt = (n, d = 0) => Number(n).toLocaleString('en-PH', { minimumFractionDigits: d, maximumFractionDigits: d });
const kg = (n, u = 'kg') => u === 'pc' ? `${fmt(n)} pcs` : `${fmt(n, n % 1 === 0 ? 0 : n < 1 ? 2 : 1)} kg`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2400); }

function demand() {
  const d = {}; PRODUCTS.forEach(p => d[p.id] = 0);
  state.orders.filter(o => o.date === DELIVERY_DAY && o.status !== 'cancelled').forEach(o => o.items.forEach(([c, q]) => d[c] += q));
  return d;
}
function plan() {
  const d = demand(), mult = 1 + state.buffer / 100;
  const rows = PRODUCTS.map(p => {
    const onHand = state.stock.main[p.id];
    const need = Math.max(0, d[p.id] * mult - onHand);
    return { p, ordered: d[p.id], onHand, need, heads: need / p.perHead };
  });
  const best = kind => rows.filter(r => r.p.kind === kind).reduce((a, b) => b.heads > a.heads ? b : a);
  const pork = best('pork'), chicken = best('chicken');
  return { rows, pigs: Math.ceil(pork.heads), pigLimit: pork.p, birds: Math.ceil(chicken.heads), birdLimit: chicken.p };
}
const statusPill = s => `<span class="pill p-${s === 'in transit' ? 'processing' : s}">${s[0].toUpperCase() + s.slice(1)}</span>`;
const itemsText = items => items.map(([c, q]) => `${P[c].name.split(' (')[0]} ${kg(q, P[c].unit)}`).join(', ');

const VIEWS = {
  dashboard() {
    const pl = plan(), d = demand();
    const kgOrdered = PRODUCTS.filter(p => p.unit === 'kg').reduce((s, p) => s + d[p.id], 0);
    const low = [];
    LOCS.slice(1).forEach(l => PRODUCTS.forEach(p => { if (state.stock[l.id][p.id] < state.reorder[p.id]) low.push([l, p]); }));
    const stockValue = LOCS.reduce((s, l) => s + PRODUCTS.reduce((t, p) => t + state.stock[l.id][p.id] * p.price, 0), 0);
    return `
    <div class="head"><div><h1>Good morning, here is ${DELIVERY_DAY}</h1><p class="sub">Orders close at 6 PM tonight. Buying list is based on confirmed and draft orders.</p></div></div>
    <div class="tiles">
      <div class="tile"><div class="k">Orders for ${DELIVERY_DAY.split(', ')[1]}</div><div class="v">${state.orders.filter(o => o.date === DELIVERY_DAY).length}</div><div class="d">${kg(kgOrdered)} of cuts + ${fmt(d.whole)} whole chickens</div></div>
      <div class="tile"><div class="k">Pigs to buy</div><div class="v">${pl.pigs}</div><div class="d">Limited by ${esc(pl.pigLimit.name)}</div></div>
      <div class="tile"><div class="k">Chickens to buy</div><div class="v">${fmt(pl.birds)}</div><div class="d">Limited by ${esc(pl.birdLimit.name)}</div></div>
      <div class="tile"><div class="k">Stock value, all sites</div><div class="v">₱${fmt(stockValue / 1000, 0)}k</div><div class="d">At store selling prices</div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>Needs your attention</h2><ul class="alerts">
        <li><span class="pill p-bad">Variance</span><div>Store 2 received <b>7.5 kg less</b> than dispatched on TR-552 (4.2%). <a href="#audit">Open audit trail</a></div></li>
        <li><span class="pill p-warn">Yield</span><div>LOT-1123-P03 cut yield was 68.5%, below the 70% target. <a href="#audit">See checkpoints</a></div></li>
        <li><span class="pill p-warn">Low stock</span><div>${low.length} cut${low.length === 1 ? '' : 's'} below reorder level at stores${low.length ? ': ' + low.slice(0, 3).map(([l, p]) => `${p.name.split(' (')[0]} at ${l.name.split(' · ')[0]}`).join(', ') + (low.length > 3 ? '…' : '') : ''}. <a href="#inventory">View inventory</a></div></li>
        <li><span class="pill p-draft">Draft</span><div>SO-1044 from Lechon Haus is still a draft. <a href="#orders">Review orders</a></div></li>
      </ul></div>
      <div class="panel"><h2>Activity today</h2><div class="scroll"><table><tbody>
        ${LOG.slice(0, 4).map(r => `<tr><td class="mono muted" style="white-space:nowrap">${r[0].split(', ')[1]}</td><td>${esc(r[2])}<div class="muted" style="font-size:12px">${esc(r[1])}</div></td></tr>`).join('')}
      </tbody></table></div></div>
    </div>`;
  },

  orders() {
    const opts = PRODUCTS.map(p => `<option value="${p.id}">${esc(p.name)} (${p.unit})</option>`).join('');
    return `
    <div class="head"><div><h1>Orders</h1><p class="sub">From FJC stores and outside clients. Confirmed orders feed the forecast.</p></div></div>
    <div class="panel"><h2>New order</h2>
      <form id="orderForm" class="form" novalidate>
        <div><label for="oc">Client or store</label><select id="oc">${CLIENTS.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
        <div><label for="od">Delivery day</label><select id="od"><option>${DELIVERY_DAY}</option><option>Thu, Nov 26</option></select></div>
        <div><label for="os">Status</label><select id="os"><option value="confirmed">Confirmed</option><option value="draft">Draft</option></select></div>
        <div class="lines" id="lines">
          <div class="line"><select id="ol0" aria-label="Cut">${opts}</select><input id="oq0" type="number" min="0" step="0.5" value="20" aria-label="Quantity"><span class="muted">qty</span></div>
          <div class="line"><select id="ol1" aria-label="Cut">${opts}</select><input id="oq1" type="number" min="0" step="0.5" value="" placeholder="0" aria-label="Quantity"><span class="muted">qty</span></div>
        </div>
        <div><button class="primary" type="submit">Add order</button></div>
      </form>
    </div>
    <div class="panel"><h2>All orders</h2><div class="scroll"><table>
      <thead><tr><th>Order</th><th>Client</th><th>Delivery</th><th>Items</th><th>Status</th></tr></thead>
      <tbody>${state.orders.map(o => `<tr><td class="mono">${o.id}</td><td>${esc(o.client)}</td><td style="white-space:nowrap">${o.date}</td><td>${esc(itemsText(o.items))}</td><td>${statusPill(o.status)}</td></tr>`).join('')}</tbody>
    </table></div></div>`;
  },

  forecast() {
    const pl = plan();
    const section = kind => `
      <div class="panel"><h2><span class="dot ${kind}"></span>${kind === 'pork' ? 'Pork' : 'Chicken'}: buy <span class="num">${kind === 'pork' ? pl.pigs + ' pigs' : fmt(pl.birds) + ' birds'}</span></h2>
      <p class="calc">Every ${kind === 'pork' ? 'pig' : 'bird'} gives all cuts at once, so the cut with the largest shortfall sets the number to buy. Here that is <span class="limit">${esc((kind === 'pork' ? pl.pigLimit : pl.birdLimit).name)}</span>. Extra cuts from the others go to store stock.</p>
      <div class="scroll"><table>
        <thead><tr><th>Cut</th><th class="n">Ordered</th><th class="n">+ buffer</th><th class="n">On hand</th><th class="n">Short</th><th class="n">Yield / ${kind === 'pork' ? 'pig' : 'bird'}</th><th class="n">${kind === 'pork' ? 'Pigs' : 'Birds'} needed</th></tr></thead>
        <tbody>${pl.rows.filter(r => r.p.kind === kind).map(r => { const lim = r.p === (kind === 'pork' ? pl.pigLimit : pl.birdLimit); return `<tr${lim ? ' style="background:var(--accent-soft)"' : ''}><td>${esc(r.p.name)}</td><td class="n">${kg(r.ordered, r.p.unit)}</td><td class="n">${kg(r.ordered * (1 + state.buffer / 100), r.p.unit)}</td><td class="n">${kg(r.onHand, r.p.unit)}</td><td class="n">${kg(r.need, r.p.unit)}</td><td class="n">${kg(r.p.perHead, r.p.unit)}</td><td class="n"${lim ? ' style="font-weight:600"' : ''}>${fmt(Math.ceil(r.heads))}</td></tr>`; }).join('')}</tbody>
      </table></div></div>`;
    return `
    <div class="head"><div><h1>Buying forecast for ${DELIVERY_DAY}</h1><p class="sub">From ${state.orders.filter(o => o.date === DELIVERY_DAY).length} orders, minus usable stock at the main office.</p></div>
      <div class="slider"><label for="buf" style="margin:0">Safety buffer</label><input id="buf" type="range" min="0" max="30" step="5" value="${state.buffer}"><span class="num" id="bufv">${state.buffer}%</span></div></div>
    ${section('pork')}${section('chicken')}
    <p class="calc">Yields per head are sample values. In the real system the owner sets them, and they are refined from actual cutting results in the audit trail. Later phases add trends from order history (paydays, fiestas, December).</p>`;
  },

  inventory() {
    const locs = state.invLoc === 'all' ? LOCS : [L[state.invLoc]];
    return `
    <div class="head"><div><h1>Cut-part inventory</h1><p class="sub">Stock on hand by location. Red cells are below the reorder level.</p></div>
      <div class="tabs" role="group" aria-label="Location">${[{ id: 'all', name: 'All locations' }, ...LOCS].map(l => `<button class="small" data-loc="${l.id}" aria-pressed="${state.invLoc === l.id}">${esc(l.name.split(' · ')[0])}</button>`).join('')}</div></div>
    <div class="panel"><div class="scroll"><table>
      <thead><tr><th>Cut</th>${locs.map(l => `<th class="n">${esc(l.name)}</th>`).join('')}${state.invLoc === 'all' ? '<th class="n">Total</th>' : ''}<th class="n">Reorder at</th></tr></thead>
      <tbody>${PRODUCTS.map(p => { const tot = LOCS.reduce((s, l) => s + state.stock[l.id][p.id], 0); return `<tr><td><span class="dot ${p.kind}"></span>${esc(p.name)}</td>${locs.map(l => { const v = state.stock[l.id][p.id], low = l.id !== 'main' && v < state.reorder[p.id]; return `<td class="n"${low ? ' style="color:var(--bad);font-weight:600"' : ''}>${kg(v, p.unit)}</td>`; }).join('')}${state.invLoc === 'all' ? `<td class="n">${kg(tot, p.unit)}</td>` : ''}<td class="n muted">${kg(state.reorder[p.id], p.unit)}</td></tr>`; }).join('')}</tbody>
    </table></div></div>
    <div class="panel"><h2>Transfers from main office</h2><div class="scroll"><table>
      <thead><tr><th>Transfer</th><th>To</th><th>Lot</th><th>Items</th><th class="n">Sent</th><th class="n">Received</th><th>Status</th><th></th></tr></thead>
      <tbody>${state.transfers.map(t => { const sent = t.sent.reduce((s, [c, q]) => s + (P[c].unit === 'kg' ? q : 0), 0); const diff = t.received != null ? t.received - sent : null; return `<tr><td class="mono">${t.id}</td><td>${esc(L[t.to].name)}</td><td class="mono">${t.lot}</td><td>${esc(itemsText(t.sent))}</td><td class="n">${kg(sent)}</td><td class="n">${t.received != null ? kg(t.received) + (diff < 0 ? ` <span class="pill ${-diff / sent > 0.01 ? 'p-bad' : 'p-ok'}">${fmt(diff, 1)}</span>` : '') : '—'}</td><td>${statusPill(t.status)}</td><td>${t.status === 'in transit' ? `<button class="small" data-recv="${t.id}">Confirm receipt</button>` : ''}</td></tr>`; }).join('')}</tbody>
    </table></div><p class="calc" style="margin:10px 0 0">Store keepers confirm what they actually received. Any difference over 1% raises a variance alert in the audit trail.</p></div>`;
  },

  audit() {
    const lot = LOTS[state.lot];
    return `
    <div class="head"><div><h1>Audit trail</h1><p class="sub">Follow any lot from farm pickup to store delivery. Each checkpoint records who, when, and how much.</p></div>
      <div style="min-width:240px"><label for="lotsel">Lot</label><select id="lotsel">${Object.keys(LOTS).map(k => `<option value="${k}"${k === state.lot ? ' selected' : ''}>${k} · ${LOTS[k].kind}</option>`).join('')}</select></div></div>
    <div class="panel"><h2><span class="dot ${lot.kind}"></span><span class="mono">${state.lot}</span> · ${esc(lot.label)}</h2>
      <div class="chain">${lot.cps.map((c, i) => `<div class="cp ${c.flag === 'bad' ? 'bad' : c.flag === 'warn' ? 'warn' : ''}">
        <div class="step">Checkpoint ${i + 1}</div><div class="t">${esc(c.t)}</div><div class="q">${esc(c.q)}</div>
        <div class="meta">${esc(c.who)}<br>${esc(c.at)}</div>
        <div><span class="pill ${c.flag === 'bad' ? 'p-bad' : c.flag === 'warn' ? 'p-warn' : c.flag === 'pending' ? 'p-draft' : 'p-ok'}">${esc(c.note)}</span></div></div>`).join('')}</div>
    </div>
    <div class="panel"><h2>Activity log</h2><p class="calc" style="margin:-4px 0 10px">Every change is kept with who made it and when. Edits to past records need a reason.</p><div class="scroll"><table>
      <thead><tr><th>Time</th><th>User</th><th>Action</th></tr></thead>
      <tbody>${LOG.map(r => `<tr><td class="mono" style="white-space:nowrap">${r[0]}</td><td style="white-space:nowrap">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody>
    </table></div></div>`;
  },
};

function render() {
  let v = location.hash.slice(1);
  if (!VIEWS[v]) v = 'dashboard';
  document.querySelectorAll('.rail a').forEach(a => a.dataset.v === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $('#main').innerHTML = `<div class="banner">Prototype with sample data. Names, prices, and yields are examples. Changes reset when the page reloads.</div>` + VIEWS[v]();
  bind(v);
}

function bind(v) {
  if (v === 'orders') {
    $('#orderForm').addEventListener('submit', e => {
      e.preventDefault();
      const items = [0, 1].map(i => [$('#ol' + i).value, parseFloat($('#oq' + i).value)]).filter(([, q]) => q > 0);
      if (!items.length) { toast('Enter a quantity for at least one cut.'); return; }
      const n = 1046 + state.orders.filter(o => +o.id.slice(3) >= 1046).length;
      state.orders.unshift({ id: 'SO-' + n, client: $('#oc').value, date: $('#od').value, status: $('#os').value, items });
      LOG.unshift(['Nov 24, 09:00', 'Office manager', `Created SO-${n} for ${$('#oc').value}`]);
      render(); toast(`Added SO-${n}. The forecast now includes it.`);
    });
  }
  if (v === 'forecast') {
    $('#buf').addEventListener('input', e => { $('#bufv').textContent = e.target.value + '%'; });
    $('#buf').addEventListener('change', e => { state.buffer = +e.target.value; render(); $('#buf').focus(); });
  }
  if (v === 'inventory') {
    document.querySelectorAll('[data-loc]').forEach(b => b.addEventListener('click', () => { state.invLoc = b.dataset.loc; render(); }));
    document.querySelectorAll('[data-recv]').forEach(b => b.addEventListener('click', () => {
      const t = state.transfers.find(x => x.id === b.dataset.recv);
      const sent = t.sent.reduce((s, [c, q]) => s + (P[c].unit === 'kg' ? q : 0), 0);
      t.received = sent; t.status = 'received';
      t.sent.forEach(([c, q]) => { state.stock[t.to][c] += q; });
      LOG.unshift(['Nov 24, 09:05', L[t.to].name, `Confirmed ${t.id} received in full: ${kg(sent)}`]);
      render(); toast(`${t.id} received. ${L[t.to].name} stock updated.`);
    }));
  }
  if (v === 'audit') {
    $('#lotsel').addEventListener('change', e => { state.lot = e.target.value; render(); });
  }
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
</script>
